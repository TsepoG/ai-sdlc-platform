name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Empty on fork PRs and until the owner adds them; the Sonar steps check before running.
      # SonarQube Cloud needs no host URL. For self-hosted SonarQube Server, also add a
      # SONAR_HOST_URL secret here and drop the organization argument below.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Sonar needs full history to blame new code.
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (format, lint, typecheck, tests with coverage)
        run: npm run verify

      - name: Audit dependencies
        run: npm run audit

      # Synth is environment-agnostic, so it needs no AWS credentials.
      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --quiet

      - name: SonarQube scan skipped
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == '' || env.SONAR_PROJECT_KEY == '' }}
        run: echo "::notice title=SonarQube skipped::Set the SONAR_TOKEN secret and the SONAR_ORGANIZATION and SONAR_PROJECT_KEY variables; the scan did not run."

      # SonarSource/sonarqube-scan-action v8.3.0
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
