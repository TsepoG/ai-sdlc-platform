name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Database tests run against a real PostgreSQL (same major version as RDS) and count toward
    # coverage. Each test file creates and drops its own schema.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://platform:ci-only-password@localhost:5432/platform
      # Empty on fork PRs and until the owner adds them; the Sonar steps check before running.
      # SonarQube Cloud needs no host URL. For self-hosted SonarQube Server, also add a
      # SONAR_HOST_URL secret here and drop the organization argument below.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Sonar needs full history to blame new code.
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same checks as `npm run verify`, split so a failure names the check that broke.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage (90% threshold)
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm run audit

      # Synth is environment-agnostic, so it needs no AWS credentials.
      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --quiet

      - name: SonarQube scan skipped
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == '' || env.SONAR_PROJECT_KEY == '' }}
        run: echo "::notice title=SonarQube skipped::Set the SONAR_TOKEN secret and the SONAR_ORGANIZATION and SONAR_PROJECT_KEY variables; the scan did not run."

      # SonarSource/sonarqube-scan-action v8.3.0
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg "APP_VERSION=${COMMIT_SHA}" -t ai-sdlc-platform:ci .

      - name: Start container and check /health
        run: |
          # Host networking so the container reaches the PostgreSQL service on localhost.
          docker run -d --name platform --network host \
            -e PLATFORM_ENV=local \
            -e DATABASE_HOST=127.0.0.1 -e DATABASE_NAME=platform -e DATABASE_USER=platform \
            -e DATABASE_PASSWORD=ci-only-password -e DATABASE_SSL=false \
            ai-sdlc-platform:ci
          for attempt in $(seq 1 15); do
            body="$(curl -fsS --max-time 5 http://localhost:8080/health || true)"
            if [ "$(echo "${body}" | jq -r '.status + " " + .version' 2>/dev/null)" = "ok ${COMMIT_SHA}" ]; then
              echo "Healthy: ${body}"
              exit 0
            fi
            echo "Attempt ${attempt}: not ready (${body:-no response})"
            sleep 2
          done
          docker logs platform
          exit 1

      - name: Check /ready reports the database reachable
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/ready)"
          if [ "${status}" != "200" ]; then
            echo "::error::/ready returned ${status}, expected 200"
            docker logs platform
            exit 1
          fi
          echo "Ready: $(curl -sS http://localhost:8080/ready)"

      - name: Check the workflow routes are not registered
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST --max-time 5 http://localhost:8080/initiatives)"
          if [ "${status}" != "404" ]; then
            echo "::error::POST /initiatives returned ${status}, expected 404"
            exit 1
          fi

      - name: Check /stages serves the stage configuration
        run: |
          body="$(curl -fsS --max-time 5 http://localhost:8080/stages)"
          count="$(echo "${body}" | jq '.stages | length')"
          if [ "${count}" != "7" ]; then
            echo "::error::/stages returned ${count} stages, expected 7"
            docker logs platform
            exit 1
          fi
          echo "Stages: $(echo "${body}" | jq -c '[.stages[].key]')"

      - name: Stop container
        if: always()
        run: docker rm -f platform
